        body{
            color: white;

<body id="bd4">
    <h1 id="teste">
        Página 4 
    </h1>
    <a href="ex_aula_css14_pag1.html"> <button>Página 1</button></a>
    <a href="ex_aula_css14pag2.html"> <button>Página 2</button></a>
    <a href="ex_aula_css14pag3.html"> <button>Página 3</button></a>
    <hr>
    <form action="">
        <h1>Formulário</h1>
        <fieldset>
            
            <legend><h2>Preencha com suas informações</h2></legend>
            <p>
                <label for="nome"><b>Nome:</b></label>
                    <input type="text" id="nome" name="nome"
                      placeholder="Insira seu nome">
            </p>
              <p>
                <label for="telefone"><b>Telefone:</b></label>
                    <input type="tel" id="telefone" name="telefone"
                         placeholder="Insira seu telefone">
            </p>
            <p>
                <label for="email"><b>Email:</b></label>
                    <input type="email" name="email" id="email"
                            placeholder="Insira seu melhor email" >
            </p>
            <h3>Endereço:</h3>
            <p>
                <label for="cidade"><b>Cidade: </b></label>
                    <input type="text" id="cidade" name="cidade"
                        placeholder="Insira aqui">
            </p>
            <p>
                <label for="nome"><b>Bairro:</b></label>
                    <input type="text" id="nome" name="nome"
                        placeholder="Insira aqui">
            </p>
            
            <p>
              <label for="rua"><b>Rua:</b></label>
                <input type="text" id="rua" name="rua"
                    placeholder="Insira aqui">
              <label for="numero">Número: </label>
                <input type="number" id="numero" style="width: 60px;" min="0">
            </p>
           
        </fieldset>
        <p>
           <input type="submit" value="Enviar Dados">
       </p>
    </form>
</body>
