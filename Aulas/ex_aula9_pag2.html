<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício aula 9</title>
    <style>
        body {
            background-color: #1a7abb;
            color: #ddc915;
        }
    </style>
</head>
<body>
    <p>
        <a href="ex_aula9_pag1.html"><button>| Página 1 |</button>
        </a>
            
    </p>
    <form action="">
        <h1>Página 2</h1>
        <hr>
        <p>
            <label for="nome">Nome:</label>
            <input type="text" name="nome" id="nome"
            placeholder="Digite aqui" size="40">
        </p>
         <p>
            <label for="data_nascimento">Data de Nascimento:</label>
            <input type="date" name="data_nascimento" id="data_nascimento"
            placeholder="Digite aqui" >
        </p>
        <p>
            <legend>Sexo:</legend>
            <input type="radio" name="sexo" id="sexo" value="sexo">
                <label for="masculino">Masculino</label>
            <input type="radio" name="sexo" id="sexo" value="sexo">
                <label for="feminino">Feminino</label>
            <input type="radio" name="sexo" id="sexo" value="sexo">
                <label for="outro">Outro</label>
        </p>
          <fieldset>
          <legend>Endereço</legend>
            <p>
                <label for="estado">Estado:</label>
                    <select name="estado" id="estado">
                        <option value="0"> </option>
                        <option value="ES">Espírito Santo</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="SP">São Paulo</option>
                    </select>
            </p>
            <p>
                <label for="cidade">Cidade:</label>
                    <select name="cidade" id="cidade">
                        <option value="0"></option>
                        <option value="TTÉ">Taubaté</option>
                        <option value="TBE">Tremembé</option>
                        <option value="CJO">Campos do Jordão</option>
                        <option value="SJC">São José dos Campos</option>
                    </select>
            </p>
            <p>
                <label for="Bairro">Bairro:</label>
                <input type="text" name="Bairro" id="Bairro"
                placeholder="Digite aqui" >
            </p>
            <p>
            <label for="rua">Rua:</label>
            <input type="text" name="rua" id="rua"
            placeholder="Digite aqui" >
            </p>
            <p>
            <label for="numero">Número:</label>
            <input type="number" name="numero" id="numero" min="1" max="150" 
            placeholder="Digite aqui" >
            </p>
          </fieldset>
        <p>
            <label for="email">Email:</label>
            <input type="email" name="email" id="email"
            placeholder="Digite aqui" >
        </p>
        <p>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone"
            placeholder="(__)_____-____" >
        </p>
        <fieldset>
            <legend>Áreas de Interesse</legend>
            <p>
                <input type="checkbox" name="computacao" id="computacao">
                <label for="computacao">Computação</label>
            </p>
            <p>
                <input type="checkbox" name="engenharia" id="engenharia">
                <label for="engenharia">Engenharia</label>
            </p>
            <p>
                <input type="checkbox" name="historia" id="historia">
                <label for="historia">História</label>
            </p>
        </fieldset>
        <br>
        <fieldset>
            <legend>Login</legend>
            <p>
                <label for="usuario">Usuário:</label>
                <input type="text" name="usuario" id="usuario"
                placeholder="Digite aqui" >
            </p>
                <p>
                <label for="senha">Senha:</label>
                <input type="password" name="senha" id="senha" value="senha"
                placeholder="Digite aqui" >
            </p>
        </fieldset>
        <p>
            <input type="submit" value="Enviar Dados">
        </p>
    </form>
    
</body>
</html>
